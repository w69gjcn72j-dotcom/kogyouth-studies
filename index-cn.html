<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --night: #0e1a2b; --night-soft: #142339; --night-card: #1a2c47;
    --brass: #d4a253; --brass-soft: #b08539; --cream: #f5ead4; --cream-dim: #c9bfa8;
    --line: rgba(212,162,83,0.18); --line-strong: rgba(212,162,83,0.42);
  }
  html { font-size: 18px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: 'Inter Tight', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
    background: var(--night); color: var(--cream);
    min-height: 100vh; line-height: 1.65; position: relative; overflow-x: hidden;
    display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(245,234,212,0.45), transparent),
      radial-gradient(1px 1px at 78% 9%, rgba(245,234,212,0.35), transparent),
      radial-gradient(1.5px 1.5px at 42% 32%, rgba(212,162,83,0.5), transparent),
      radial-gradient(1px 1px at 89% 64%, rgba(245,234,212,0.4), transparent),
      radial-gradient(1px 1px at 23% 73%, rgba(245,234,212,0.35), transparent),
      radial-gradient(1.5px 1.5px at 60% 88%, rgba(212,162,83,0.45), transparent),
      radial-gradient(1px 1px at 33% 51%, rgba(245,234,212,0.28), transparent),
      radial-gradient(1px 1px at 95% 36%, rgba(245,234,212,0.35), transparent);
  }
  body::after {
    content: ''; position: fixed; top: -220px; left: 50%; transform: translateX(-50%);
    width: 820px; height: 520px; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(212,162,83,0.13), transparent 65%);
  }
  .shell { position: relative; z-index: 1; width: min(760px, 100%); margin: 0 auto; padding: 0 1.35rem; }

  .langbar { display: flex; justify-content: flex-end; padding-top: 1.1rem; }
  .langbar a {
    font-size: 0.76rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--brass); text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 0.3rem 0.85rem;
  }
  .langbar a:hover { border-color: var(--line-strong); color: var(--cream); }

  header { text-align: center; padding: 2rem 0 1.8rem; }
  .eyebrow {
    font-size: 0.72rem; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--brass); margin-bottom: 1.1rem;
    display: flex; align-items: center; justify-content: center; gap: 0.8rem;
  }
  .eyebrow::before, .eyebrow::after { content: ''; height: 1px; width: 34px; background: var(--brass-soft); opacity: 0.6; }
  .crest { width: 74px; height: 74px; margin: 0 auto 1.1rem; display: block; border-radius: 18px; border: 1px solid var(--line); }
  h1 {
    font-family: 'Fraunces', 'Songti SC', 'STSong', Georgia, serif; font-weight: 600;
    font-size: clamp(2rem, 7vw, 2.9rem); line-height: 1.12; letter-spacing: -0.01em;
  }
  .tagline { margin-top: 0.85rem; color: var(--cream-dim); font-size: 1rem; max-width: 520px; margin-left: auto; margin-right: auto; }
  .count { margin-top: 0.9rem; font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--brass); }

  .searchbar { position: sticky; top: 0; z-index: 5; padding: 0.8rem 0 1rem; background: linear-gradient(var(--night) 72%, transparent); }
  .searchbar input {
    width: 100%; font: inherit; font-size: 0.95rem; color: var(--cream);
    background: var(--night-soft); border: 1px solid var(--line); border-radius: 12px;
    padding: 0.75rem 1rem; outline: none;
  }
  .searchbar input::placeholder { color: var(--cream-dim); opacity: 0.7; }
  .searchbar input:focus { border-color: var(--line-strong); }

  .group { margin-bottom: 1rem; border: 1px solid var(--line); border-radius: 16px; background: rgba(20,35,57,0.55); overflow: hidden; }
  .group > button {
    width: 100%; display: flex; align-items: center; gap: 0.75rem; text-align: left;
    font: inherit; color: var(--cream); background: none; border: 0; cursor: pointer;
    padding: 1rem 1.2rem;
  }
  .group > button:hover { background: rgba(212,162,83,0.05); }
  .group h2 { font-family: 'Fraunces', 'Songti SC', 'STSong', Georgia, serif; font-weight: 600; font-size: 1.12rem; flex: 1; }
  .group .n { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass); white-space: nowrap; }
  .group .chev { color: var(--brass); transition: transform 0.2s; flex: none; }
  .group.open .chev { transform: rotate(90deg); }
  .group .items { display: none; padding: 0 0.7rem 0.7rem; }
  .group.open .items { display: block; }

  .item { border-top: 1px solid var(--line); padding: 0.9rem 0.55rem; cursor: pointer; }
  .item:first-child { border-top: 0; }
  .item .ref { font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass); }
  .item .name { font-family: 'Fraunces', 'Songti SC', 'STSong', Georgia, serif; font-size: 1.05rem; margin-top: 0.15rem; }
  .item .note { color: var(--cream-dim); font-style: italic; font-size: 0.86rem; }
  .item .body { display: none; margin-top: 0.6rem; color: var(--cream-dim); font-size: 0.93rem; }
  .item.open .body { display: block; }
  .item .idea { color: var(--cream); border-left: 2px solid var(--brass); padding-left: 0.75rem; margin-bottom: 0.55rem; }
  .item .go { display: inline-block; margin-top: 0.7rem; color: var(--brass); font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; }
  .item .go::after { content: ' →'; }
  .item .go:hover { color: var(--cream); }

  .empty { text-align: center; color: var(--cream-dim); padding: 2rem 0; display: none; }

  .tip { margin: 1.6rem 0 0; padding: 1.05rem 1.2rem; background: rgba(20,35,57,0.6); border: 1px solid var(--line); border-radius: 14px; font-size: 0.9rem; color: var(--cream-dim); }
  .tip b { display: block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--brass); margin-bottom: 0.5rem; }
  .tip code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; color: var(--cream); word-break: break-all; }

  footer {
    position: relative; z-index: 1; margin-top: auto; padding: 2.6rem 1.35rem 2.8rem;
    border-top: 1px solid var(--line); text-align: center;
    color: var(--cream-dim); font-size: 0.86rem; line-height: 1.85;
  }
  footer a { color: var(--brass); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .sdg { display: block; margin-top: 0.9rem; font-family: 'Fraunces', 'Songti SC', 'STSong', Georgia, serif; font-style: italic; color: var(--brass-soft); }
  @media (max-width: 420px) { html { font-size: 17px; } }
  .count, .group .n, .item .ref, .item .go, .eyebrow, .langbar a, .tip b,
  .back, .lang, footer, .bigidea b { letter-spacing: 0.05em; text-transform: none; }
</style>

<div class="shell">

    <p class="eyebrow">高嘉华圣保罗圣公会</p>
    <h1>青少年成长小组查经</h1>
    <p class="tagline">为中学生成长小组预备的查经——读经、讨论、祷告，按学期编排。</p>

  </header>

  <div class="searchbar">
    <input id="q" type="search" placeholder="搜索经文、题目、内容…" autocomplete="off" spellcheck="false">

  <main id="list"></main>
  <p class="empty" id="empty">没有找到相关内容。</p>

  <section class="tip">

    用 Safari 打开本页，点「分享」，再选「添加到主屏幕」。它会以自己的图标保存，并以全屏方式打开。

  </section>
</div>

<script>
/* ----------------------------------------------------------------------
   青少年成长小组查经
   To add an entry: copy one block below, edit it, and put the matching
   page file beside this file. Nothing else changes.
   Newest entries go at the TOP of their group.
   ---------------------------------------------------------------------- */
const STUDIES = [
  {
    "n": 1,
    "title": "样版 — 怎样加入一篇查经",
    "ref": "由此开始",
    "group": "开始使用",
    "note": "样版",
    "idea": "复制这一项和相应的页面文件，就可以加入第一篇查经。",
    "blurb": "这是一个示范骨架，显示各个标题和整体风格。有了真正的查经之后请删掉。",
    "page": "001-template-how-to-add-a-study-cn.html"
  },
  {
    "n": 5,
    "title": "假冒为善的人与那颗心",
    "ref": "罗马书 2:17-3:8",
    "group": "2026年第二学期",
    "note": "2026年7月",
    "idea": "不要作言行不一、以致神的名受亵渎的教师；要作心里受了圣灵割礼的人，活出神的话，得着从神来的称赞，使他得荣耀。",
    "blurb": "答得出正确答案，并不等于心已经改变——而这中间的落差，叫神的名受了亵渎。这课讲的是心里的割礼：真实、在内里，得的是从神来的称赞，而不是从人来的。",
    "page": "005-the-hypocrite-and-the-heart-cn.html"
  },
  {
    "n": 4,
    "title": "在神公义的审判下无可推诿",
    "ref": "罗马书 2:1-16",
    "group": "2026年第二学期",
    "note": "2026年7月",
    "idea": "神的审判完全公平——他按真理、按行为、按人所得的亮光审判，所以没有人能用「我是好人」来推诿。我们唯一的出路是耶稣。",
    "blurb": "神的审判完全公正：按真理，按各人所行的，并且不偏待人。这课把我们指着别人的手指转回自己身上，也让我们看见神的恩慈原是要领我们悔改。",
    "page": "004-inexcusable-in-gods-righteous-judgement-cn.html"
  },
  {
    "n": 3,
    "title": "当神任凭人的时候",
    "ref": "罗马书 1:18-32",
    "group": "2026年第二学期",
    "note": "2026年7月",
    "idea": "每个人其实都已经知道神是真的——却不断把这真理压下去。人若一直这样，神的审判有时看起来就像：让他们如愿以偿——过一个完全没有神的人生。耶稣是离开这条路的唯一出路。",
    "blurb": "人本来就知道神是真实的，人心却一再把这份认识压下去。这课面对神最叫人警醒的审判——任凭人去走自己坚持要走的路——也说明为何福音是唯一的归路。",
    "page": "003-what-happens-when-god-lets-go-cn.html"
  },
  {
    "n": 2,
    "title": "不以福音为耻：神福音的大能与神的义",
    "ref": "罗马书 1:16-17",
    "group": "2026年第二学期",
    "note": "2026年6月",
    "idea": "不要因福音而觉得难为情——这福音本是神的大能，要救一切相信的；神的义也在这福音上显明出来，本于信，以致于信。",
    "blurb": "保罗不以福音为耻，因为这福音是神的大能，要救一切相信的人。这课问我们在哪里对耶稣闭口不言，也问「本于信，以致于信」在学校里是什么样子。",
    "page": "002-unashamed-the-power-and-righteousness-of-gods-gospel-cn.html"
  },
  {
    "n": 9,
    "title": "基督十字架那愚拙的智慧",
    "ref": "哥林多前书 1:18-25",
    "group": "2026年第三学期",
    "note": "2026年8月",
    "idea": "不要做听起来聪明的愚昧人，要做听起来愚拙的智慧人；因为神乐意拯救一切相信「基督被钉十字架」这信息的人。",
    "blurb": "十字架的道理把世界分成两半，在一边听来就是愚拙。这课讲的是：不加修饰地把耶稣说清楚。",
    "page": "009-the-foolish-wisdom-of-the-cross-of-christ-cn.html"
  },
  {
    "n": 8,
    "title": "无可指望时仍有指望",
    "ref": "罗马书 4:1-25",
    "group": "2026年第三学期",
    "note": "2026年8月",
    "idea": "要满心相信、满有喜乐，在无可指望的时候仍有指望，信靠那位把义算给信他之人的神——他叫我们的主耶稣从死里复活。",
    "blurb": "亚伯拉罕在做任何事之前就被算为义，我们也是一样。这课讲的是：即使一切看来已经死了，仍然完全相信神能成就他所应许的。",
    "page": "008-hope-against-hope-cn.html"
  },
  {
    "n": 7,
    "title": "神怎能赦免人，又仍然是良善的？",
    "ref": "罗马书 3:21-31",
    "group": "2026年第三学期",
    "note": "2026年8月",
    "idea": "因为世人都犯了罪，所以人人都是因信耶稣基督称义；神设立他作挽回祭，为要显明神的义。",
    "blurb": "圣经里最重要的一句「但如今」：有罪的人因信耶稣白白称义。这课让我们看见赦免从来不廉价——神亲自付上代价，好使他既是公义的，又能称人为义。",
    "page": "007-how-can-god-forgive-and-still-be-good-cn.html"
  },
  {
    "n": 6,
    "title": "镜中的罪人",
    "ref": "罗马书 3:9-20",
    "group": "2026年第三学期",
    "note": "2026年7月",
    "idea": "神的律法照出我们真实、彻底败坏的自己——所有人一同伏在罪的权势之下，连一个义人也没有——好叫每一张口在神的审判面前都无话可说。",
    "blurb": "保罗从头到脚的诊断，没有漏掉一个人——连看来很好的人也不例外。这课最后落在：敬畏神是一种恩慈，把我们赶到耶稣那里。",
    "page": "006-the-sinner-in-the-mirror-cn.html"
  }
];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function groups() {
  const map = new Map();
  STUDIES.forEach(s => {
    if (!map.has(s.group)) map.set(s.group, []);
    map.get(s.group).push(s);
  });
  return map;
}

function render(filter) {
  const f = (filter || "").trim().toLowerCase();
  const list = $("list");
  list.innerHTML = "";
  let shown = 0;

  groups().forEach((items, name) => {
    const hits = items.filter(s => !f || [s.title, s.ref, s.group, s.note, s.idea, s.blurb]
      .filter(Boolean).join(" ").toLowerCase().includes(f));
    if (!hits.length) return;
    shown += hits.length;

    const sec = document.createElement("section");
    sec.className = "group" + (f ? " open" : "");
    sec.innerHTML =
      '<button type="button">' +
        '<span class="chev">›</span>' +
        '<h2>' + esc(name) + '</h2>' +
        '<span class="n">' + hits.length + ' 查经</span>' +
      '</button><div class="items"></div>';
    sec.querySelector("button").addEventListener("click", () => sec.classList.toggle("open"));

    const box = sec.querySelector(".items");
    hits.forEach(s => {
      const el = document.createElement("article");
      el.className = "item";
      el.innerHTML =
        '<div class="ref">' + esc(s.ref) + '</div>' +
        '<div class="name">' + esc(s.title) +
          (s.note ? ' <span class="note">(' + esc(s.note) + ')</span>' : '') + '</div>' +
        '<div class="body">' +
          (s.idea ? '<p class="idea">' + esc(s.idea) + '</p>' : '') +
          (s.blurb ? '<p>' + esc(s.blurb) + '</p>' : '') +
          (s.page ? '<a class="go" href="' + esc(s.page) + '">打开查经</a>' : '') +
        '</div>';
      el.addEventListener("click", ev => {
        if (ev.target.closest("a")) return;
        el.classList.toggle("open");
      });
      box.appendChild(el);
    });
    list.appendChild(sec);
  });

  $("empty").style.display = shown ? "none" : "block";
  $("count").textContent = STUDIES.length + " 查经";
}

$("q").addEventListener("input", e => render(e.target.value));
render("");

(function () {
  var base = location.href.replace(/index(-cn)?\.html$/, "").replace(/[?#].*$/, "");
  if (base.slice(-1) !== "/") base += "/";
  $("url").textContent = base.replace(/^https?:\/\//, "") + "index-cn.html";
})();
</script>
</body>
